# CI: on every push and pull request, GitHub installs the project on a clean machine, then runs
# the typecheck and the unit tests. A red X on the commit means one of them failed.
#
# No Postgres, Kafka, .env or models here. The tests only cover pure functions (RRF, chunking,
# windowing, timestamps), so this stays fast and never downloads the 1.6 GB of models.

name: CI

on:
  push:
  pull_request:

# The job only reads the code, so it gets no write access to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a stuck run fails instead of hanging
    steps:
      - uses: actions/checkout@v7

      # Same Bun version as local: read from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # --frozen-lockfile fails if bun.lock doesn't match package.json, so CI tests exactly
      # the dependency versions that are committed.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test
